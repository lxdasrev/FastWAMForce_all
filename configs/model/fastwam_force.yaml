_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: 8
redirect_common_files: true
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false
init_mode: pretrained

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 7
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: 7
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

force_dit_config:
  force_dim: 2
  hidden_dim: 512
  encoder_hidden_dim: 128
  ffn_dim: 2048
  text_dim: 4096
  freq_dim: 256
  num_layers: 10
  num_heads: 8
  head_dim: 64
  bridge_num_heads: 24
  bridge_head_dim: 128
  max_history_frames: 16
  future_frames: 32
  eps: 1.0e-06
  dropout: 0.0

force_to_backbone:
  1: 8
  2: 10
  3: 13
  4: 15
  5: 17
  6: 20
  7: 22

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000
force_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_force: 1.0
